<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- پس‌زمینه دارک با گرید تعاملی -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- گرادینت اصلی حرف P (آبی به بنفش) -->
    <linearGradient id="pGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- گرادینت نئونی شیشه‌ای -->
    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- افکت درخشش نئون -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- پس‌زمینه گرد مدرن -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#strokeGradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- سایه درخشان پشت حرف P -->
  <path d="M 160 112 L 272 112 C 342 112 384 148 384 212 C 384 276 342 312 272 312 L 224 312 L 224 400 L 160 400 Z" 
        fill="url(#pGradient)" 
        opacity="0.4" 
        filter="url(#neonGlow)" />

  <!-- شکل اصلی حرف P -->
  <path d="M 160 112 L 272 112 C 342 112 384 148 384 212 C 384 276 342 312 272 312 L 224 312 L 224 400 Q 224 400 160 400 Z" 
        fill="url(#pGradient)" />

  <!-- برش داخلی حرف P (فضای خالی داخل حلقه) -->
  <path d="M 224 172 L 264 172 C 300 172 320 188 320 212 C 320 236 300 252 264 252 L 224 252 Z" 
        fill="#070a12" />
</svg>
